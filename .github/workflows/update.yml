name: Update results

on:
  schedule:
    - cron: "0 8 * * *"      # every morning, 08:00 UTC
  workflow_dispatch:          # and a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 build_results.py
      - name: Commit if the results changed
        run: |
          git config user.name "pick3-results"
          git config user.email "actions@users.noreply.github.com"
          git add results_*.csv players_*.csv
          git diff --cached --quiet || (git commit -m "Update results" && git push)
